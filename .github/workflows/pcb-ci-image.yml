# Builds the CI image for tools/pcb and publishes it to the repository's GitHub Container Registry.
# Runs when tools/pcb/ci/ changes, or by hand. The tag is the image version in the Dockerfile.
name: pcb CI image

on:
  push:
    paths: [tools/pcb/ci/**, .github/workflows/pcb-ci-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Image version
        id: v
        run: echo "version=$(sed -n 's/^ARG IMAGE_VERSION=//p' tools/pcb/ci/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: tools/pcb/ci
          push: true
          tags: ghcr.io/${{ github.repository }}/pcb-ci:${{ steps.v.outputs.version }}
