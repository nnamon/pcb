[package]
name = "pcb"
version = "0.5.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
geo = "0.33.1"
pdf-writer = "0.12"
resvg = "0.49.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
svg2pdf = "0.13.0"
toml = "1.1.8"
ttf-parser = "0.25"

[lints.clippy]
# Board geometry passes many plain values and tuples; aliases and structs for each would hide more than they name.
too_many_arguments = "allow"
type_complexity = "allow"

[workspace]
members = ["xtask"]
