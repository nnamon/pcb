# The badge carrier's routed board r36a, as a frozen acceptance fixture for pcb.
# circuit.json: nandynarwhals-defcon-sg-2027-badge/design/layout/runs/r36a.json (ignored there; copied here
# 30 Oct 2026 so the tests never depend on a scratch file). nfc_coil.json: the coil data from the same folder.

[fixture]
name = "badge_r36a"
circuit_json = "circuit.json"
layers = 4

# the NFC coil is drawn as a trace on its own net between L601's two pins; spike 3 makes it a net tie
[import]
allow_cross_net = ["NFC_COIL"]

# Board-level holes, named as in the source (source/badge.tsx), at tscircuit coordinates (mm, y up).
[import.holes]
H1 = [-76, 51]
H2 = [76, 51]
H3 = [-76, -51]
H4 = [76, -51]
H5 = [53.5, -29.5]
H6 = [76.5, -29.5]
H7 = [53.5, 28.6]
H8 = [76.5, 28.6]

# Back-side convention check (review 1, B2): the part's library pads in KiCad's library frame (mm, y down,
# origin at the courtyard centre), from source/parts/KEYSTONE_2464.tsx (pcbX, -pcbY).
[import.back_side.BT101]
pads = { "1" = [14.05, -26.25], "2" = [1.35, -26.25] }

# Route cases run on the imported board.
[[route]]
name = "reroute_usb_sense"
region = [40, 20.5, 60, 36]
rip = ["USB_SENSE"]
nets = ["USB_SENSE"]
targets = ["USB_SENSE"]
expect = "done"

[[route]]
name = "vbus_f_at_width"
region = [40, 20.5, 60, 36]
nets = ["VBUS_F"]
expect = "done"            # no path at 0.3 mm: nothing gets worse, the board is written unchanged, VBUS_F reported still open
still_open = ["VBUS_F"]

# Zones (spike 3 prototype), in KiCad coordinates (mm, y down).
[zones]
# phase0/spike3.py is written for this board only; `pcb zone` (milestone M2) replaces it
prototype = "spike3"
coil_json = "nfc_coil.json"
keepouts = [
  { name = "coil", rect = [27, 98, 57.3, 123], grow = 3.5 },
  { name = "antenna", rect = [166, 45, 180, 73], grow = 0 },
]
planes = { net = "GND", layers = ["In1.Cu", "In2.Cu"], clearance = 0.35 }
# the net tie: footprint, its pad nets, and the pads its copper may join
net_tie = { footprint = "L601", group = "1, 3", pads = { "1" = "NFC_AC0", "2" = "NFC_AC1", "3" = "NFC_AC1", "4" = "NFC_AC1" }, former_net = "NFC_COIL" }
# DRC kinds the zoned board may add over its base: the most it may have of each, and why
drc_allowed = [
  { kind = "starved_thermal GND", max = 2, why = "J102 pad 4: one spoke, pad override planned (review 4, Z9 area); J701 pad 2: its top-layer relief reaches only an island of the GND pour, on every run with either zone ids (review 7, C5), and was hidden by the old allowance without a count; the plated hole still joins the GND planes; open: M2" },
  { kind = "clearance <no net> NFC_AC1", max = 2, why = "coil turn 0.075 mm from the inner via, now L601 pad 3 (review 4, Z6, open: M2); KiCad 10 reports it, KiCad 7 hid it inside the net tie" },
]
# minimum spoke width (mm) for thermal reliefs on every GND zone
spoke_min = 0.5
# non-plated holes to fill: JLCPCB's minimum; review 4 (Z8) asks for 0.3, to be set in milestone M2
npth_gap = 0.2
# fills that must exist, at no less than half the area spike 3 gave this fixture (30 Oct 2026); a lost fill fails
expect_fill = [
  { net = "BAT_F", layer = "F.Cu", min_area = 11.0 },
  { net = "BAT_RAW", layer = "B.Cu", min_area = 19.9 },
  { net = "BAT_RAW", layer = "F.Cu", min_area = 47.5 },
  { net = "GND", layer = "B.Cu", min_area = 6550.6 },
  { net = "GND", layer = "F.Cu", min_area = 4567.9 },
  { net = "GND", layer = "In1.Cu", min_area = 7577.6 },
  { net = "GND", layer = "In2.Cu", min_area = 7577.6 },
  { net = "LYRA_5V", layer = "B.Cu", min_area = 6.7 },
  { net = "LYRA_5V", layer = "F.Cu", min_area = 37.7 },
  { net = "LYRA_5V_D", layer = "F.Cu", min_area = 10.2 },
  { net = "SW_BOOST", layer = "F.Cu", min_area = 4.8 },
  { net = "V5", layer = "B.Cu", min_area = 120.1 },
  { net = "V5", layer = "F.Cu", min_area = 94.3 },
  { net = "V5_LED", layer = "B.Cu", min_area = 51.4 },
  { net = "V5_LED", layer = "F.Cu", min_area = 210.6 },
  { net = "V5_LED_SW", layer = "F.Cu", min_area = 12.1 },
  { net = "V5_LYRA", layer = "F.Cu", min_area = 5.5 },
  { net = "VBAT", layer = "B.Cu", min_area = 53.7 },
  { net = "VBAT", layer = "F.Cu", min_area = 95.7 },
  { net = "VBOOST", layer = "F.Cu", min_area = 19.4 },
  { net = "VBUS", layer = "B.Cu", min_area = 12.9 },
  { net = "VBUS", layer = "F.Cu", min_area = 8.3 },
  { net = "VBUS_F", layer = "F.Cu", min_area = 52.9 },
]
