# The badge carrier's routed board r36a, as a frozen acceptance fixture for pcb.
# circuit.json: nandynarwhals-defcon-sg-2027-badge/design/layout/runs/r36a.json (ignored there; copied here
# 30 Oct 2026 so the tests never depend on a scratch file). nfc_coil.json: the coil data from the same folder.

[fixture]
name = "badge_r36a"
circuit_json = "circuit.json"
layers = 4

# the NFC coil is drawn as a trace on its own net between L601's two pins; spike 3 makes it a net tie
[import]
allow_cross_net = ["NFC_COIL"]

# Board-level holes, named as in the source (source/badge.tsx), at tscircuit coordinates (mm, y up).
[import.holes]
H1 = [-76, 51]
H2 = [76, 51]
H3 = [-76, -51]
H4 = [76, -51]
H5 = [53.5, -29.5]
H6 = [76.5, -29.5]
H7 = [53.5, 28.6]
H8 = [76.5, 28.6]

# Back-side convention check (review 1, B2): the part's library pads in KiCad's library frame (mm, y down,
# origin at the courtyard centre), from source/parts/KEYSTONE_2464.tsx (pcbX, -pcbY).
[import.back_side.BT101]
pads = { "1" = [14.05, -26.25], "2" = [1.35, -26.25] }

# Route cases run on the imported board.
[[route]]
name = "reroute_usb_sense"
region = [40, 20.5, 60, 36]
rip = ["USB_SENSE"]
nets = ["USB_SENSE"]
targets = ["USB_SENSE"]
expect = "done"

[[route]]
name = "vbus_f_at_width"
region = [40, 20.5, 60, 36]
nets = ["VBUS_F"]
expect = "done"            # no path at 0.3 mm: nothing gets worse, the board is written unchanged, VBUS_F reported still open
still_open = ["VBUS_F"]

# PMUX_SS ripped and laid again in the box beside U106 (M1 gate). Freerouting 2.5.0 finds the path through the
# 0.15 mm gaps but fails to insert it when the region's keep-outs shape its rooms; the second attempt, with no
# keep-outs, lays it inside the region.
[[route]]
name = "reroute_pmux_ss"
region = [46, 25.5, 52, 31]
rip = ["PMUX_SS"]
nets = ["PMUX_SS"]
targets = ["PMUX_SS"]
expect = "done"
attempt_used = 1

# Edit cases run `pcb edit` on the imported board: the gate on a dense real board, and targets the import leaves
# without uuids. `ops` is the JSON operation list; `regressions` must each be among the DRC regressions reported.
[[edit]]
name = "c116_west_rejected"          # 0.09 mm west brings C116.1 within 0.15 mm of the PMUX_SS track at x 48.19
ops = '[{"op": "move_footprint", "ref": "C116", "from": [48.03, 29.0], "to": [47.94, 29.0]}]'
expect = "rejected"
regressions = ["clearance PMUX_SS VBUS_F"]

[[edit]]
name = "ilm_via_without_room_rejected"   # a via beside U106 pin 10 lands on USB_SENSE's B.Cu diagonal
ops = '[{"op": "add_track", "net": "PMUX_ILM", "layer": "F.Cu", "width": 0.15, "points": [[50.85, 29.25], [50.1, 29.25], [49.85, 29.0]]}, {"op": "add_via", "net": "PMUX_ILM", "at": [49.85, 29.0], "size": 0.6, "drill": 0.3}]'
expect = "rejected"
regressions = ["shorting_items PMUX_ILM USB_SENSE", "clearance PMUX_ILM VBUS_F"]

[[edit]]
name = "duplicate_without_uuid_refused"  # the import wrote PMUX_SS's pin-11 stub twice, with no uuids
ops = '[{"op": "delete", "what": "track", "net": "PMUX_SS", "layer": "F.Cu", "start": [50.85, 29.75], "end": [49.92, 29.75]}]'
expect = "refused"
code = "edit-no-target"

[[edit]]
name = "duplicate_removed"
ops = '[{"op": "delete", "what": "track", "net": "PMUX_SS", "layer": "F.Cu", "start": [50.85, 29.75], "end": [49.92, 29.75], "all": true}, {"op": "add_track", "net": "PMUX_SS", "layer": "F.Cu", "width": 0.15, "points": [[50.85, 29.75], [49.92, 29.75]]}]'
expect = "done"

# Zones, in KiCad coordinates (mm, y down).
[zones]
# what `pcb zone` must make from this folder's pcb.toml; verify_zones checks it
keepouts = [
  { name = "coil", rect = [27, 98, 57.3, 123], grow = 3.5 },
  { name = "antenna", rect = [166, 45, 180, 73], grow = 0 },
]
planes = { net = "GND", layers = ["In1.Cu", "In2.Cu"], clearance = 0.35 }
# the net tie: footprint, its pad nets, and the pads its copper may join
net_tie = { footprint = "L601", group = "1, 3", pads = { "1" = "NFC_AC0", "2" = "NFC_AC1", "3" = "NFC_AC1", "4" = "NFC_AC1" }, former_net = "NFC_COIL" }
# DRC kinds the zoned board may add over its base: the most it may have of each, and why
drc_allowed = [
  { kind = "starved_thermal GND", max = 2, why = "J102 pad 4: one top-layer spoke, and a solid pad override would remove its plane reliefs (check D; review 4, Z9); J701 pad 2: its top-layer relief reaches only an island of the GND pour, on every run with either zone ids (review 7, C5), and was hidden by the old allowance without a count; the plated hole still joins the GND planes; open: badge design after M4" },
  { kind = "clearance <no net> NFC_AC1", max = 2, why = "coil turn 0.075 mm from the inner via, now L601 pad 3 (review 4, Z6; open: badge design after M4); KiCad 10 reports it, KiCad 7 hid it inside the net tie" },
]
# minimum spoke width (mm) for thermal reliefs on every GND zone
spoke_min = 0.5
# non-plated holes to fill: JLCPCB's minimum; review 4 (Z8) asks for 0.3, to be set in milestone M2
npth_gap = 0.2
# fills that must exist, at no less than 95 % of the area spike 3 gives this fixture (2 Nov 2026, KiCad 10.0.8, zone ids
# from zone names so the fill repeats); half the area was allowed while the fill changed from run to run (review 5, 17)
expect_fill = [
  { net = "BAT_F", layer = "F.Cu", min_area = 45.2 },
  { net = "BAT_RAW", layer = "B.Cu", min_area = 38.3 },
  { net = "BAT_RAW", layer = "F.Cu", min_area = 77.4 },
  { net = "GND", layer = "B.Cu", min_area = 12482.1 },
  { net = "GND", layer = "F.Cu", min_area = 8743.1 },
  { net = "GND", layer = "In1.Cu", min_area = 14387.7 },
  { net = "GND", layer = "In2.Cu", min_area = 14387.7 },
  { net = "LYRA_5V", layer = "B.Cu", min_area = 12.6 },
  { net = "LYRA_5V", layer = "F.Cu", min_area = 70.4 },
  { net = "LYRA_5V_D", layer = "F.Cu", min_area = 19.3 },
  { net = "SW_BOOST", layer = "F.Cu", min_area = 9.2 },
  { net = "V5", layer = "B.Cu", min_area = 228.2 },
  { net = "V5", layer = "F.Cu", min_area = 171.4 },
  { net = "V5_LED", layer = "B.Cu", min_area = 97.6 },
  { net = "V5_LED", layer = "F.Cu", min_area = 451.7 },
  { net = "V5_LED_SW", layer = "F.Cu", min_area = 22.8 },
  { net = "V5_LYRA", layer = "F.Cu", min_area = 17.6 },
  { net = "VBAT", layer = "B.Cu", min_area = 108.3 },
  { net = "VBAT", layer = "F.Cu", min_area = 139.8 },
  { net = "VBOOST", layer = "F.Cu", min_area = 36.8 },
  { net = "VBUS", layer = "B.Cu", min_area = 24.5 },
  { net = "VBUS", layer = "F.Cu", min_area = 15.8 },
  { net = "VBUS_F", layer = "F.Cu", min_area = 123.1 },
]
