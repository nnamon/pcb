# pcb settings for paddle-keyer v1.0.0, rebuilt through pcb from its final circuit JSON. The release must match the
# files that were ordered (golden/), every difference explained in explain.toml: the M3 gate.
schema = 1

[project]
name = "paddle-keyer"
version = "1.0.0"
board = "board.kicad_pcb"
layers = 2
fab = "jlcpcb-2layer-1.6mm"

[assembly]
machine_sides = ["top"]
# the BOM and CPL renumber the parts named descriptively in the design (jlc_files.py did the same)
designators = { R_A = "R12", R_B = "R13", C_F = "C16", C_DC = "C17", Q_PTT = "Q2" }

# GND pours on both sides, joining GND pads solid, as the old pour script did
[[zone]]
net = "GND"
layers = ["F.Cu", "B.Cu"]
clearance_mm = 0.25
min_width_mm = 0.25
connect = "solid"

# the RP2040's exposed pad: four windows (about 65 % paste), so the part does not float; the USB-C shell slots take
# paste over their pads (pin in paste)
[[paste]]
pad = "U1.57"
windows = [2, 2]
size_mm = 1.25
web_mm = 0.35

[[paste]]
pad = "J1.13"
pin_in_paste = true

[[paste]]
pad = "J1.14"
pin_in_paste = true

# KiCad DRC findings the v1.0.0 order went out with, each reviewed at Gate 2
[[waiver]]
check = "drc"
item = "courtyards_overlap <no net>"
max = 28
why = "tscircuit's courtyards are the parts' land patterns drawn tight; Gate 2 checked the real bodies (bodies.json) for clearance"

[[waiver]]
check = "drc"
item = "hole_clearance <no net> GND"
max = 2
why = "J1's own GND pads 15 and 26 sit 0.2 mm from its own NPTH pegs, as the maker's footprint draws them"

[[waiver]]
check = "drc"
item = "silk_overlap <no net>"
max = 8
why = "footprint outlines of U1 and C10, and U3 and C12, touch; outlines only, no text"

# GUIDELINES' 0.6 mm floor for silkscreen text
[[waiver]]
check = "silk"
item = "text label18"
why = "\"Designed in Singapore\" went out on v1.0.0 at 0.5 mm cap height, under the 0.6 mm floor; the next spin raises it"

# the CPL centres of the two connectors, from JLCPCB's own footprints (solved by jlc_files.py for the order)
[parts.C2765186]
cpl_offset_mm = [0, 0.125]
source = "paddle-keyer v1.0.0 CPL, solved against JLCPCB's EasyEDA footprint by jlc_files.py"

[parts.C20182907]
cpl_offset_mm = [-0.1, 0]
source = "paddle-keyer v1.0.0 CPL, solved against JLCPCB's EasyEDA footprint by jlc_files.py"

# artwork, in the design's centred frame (y up): the fish touch key and the flower in exposed copper on the back,
# the photo on the back silkscreen, the hidden marks under parts on the top, the Morse rows and pin-1 dots
[[art]]
name = "fish"
file = "art/fish_fixed.json"
key = "fish"
frame = "centre"
layers = ["B.Cu", "B.Mask"]
net = "FISH"

[[art]]
name = "flower"
file = "art/logos.json"
key = "flower"
frame = "centre"
layers = ["B.Cu", "B.Mask"]
net = "GND"

[[art]]
name = "photo"
file = "art/art.json"
frame = "centre"
layers = ["B.SilkS"]

[[art]]
name = "hidden"
file = "art/hidden_top.json"
frame = "centre"
layers = ["F.SilkS"]

[[art]]
name = "morse"
file = "art/silk_marks.json"
key = "morse"
frame = "centre"
layers = ["B.SilkS"]

[[art]]
name = "pin1_dots"
file = "art/silk_marks.json"
key = "pin1_dots"
frame = "centre"
layers = ["F.SilkS"]

