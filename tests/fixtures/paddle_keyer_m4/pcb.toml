# paddle-keyer from its circuit to an order through pcb alone: the M4 gate. The circuit is the KiCad schematic in
# schematic/ (made once by make_fixture.py from paddle-keyer v1.0.0's netlist); JLCPCB's footprints and data are in
# parts/ (pcb parts --live, 4 Nov 2026); the places are v1.0.0's. Everything else is pcb's.
schema = 1

[project]
name = "paddle-keyer"
version = "2.0.0"
board = "board.kicad_pcb"
layers = 2
fab = "jlcpcb-2layer-1.6mm"
netlist = "schematic/paddle-keyer.kicad_sch"

[outline]
file = "outline.json"

[assembly]
machine_sides = ["top"]
boards = 5

# Torex XC6206 datasheet, SOT-23 pin table: 1 VSS, 2 VOUT, 3 VIN. JLCPCB's symbol for C5446 has VIN and VOUT the
# other way round (the trap paddle-keyer's README records)
[parts.C5446]
pins = { "1" = "VSS", "2" = "VOUT", "3" = "VIN" }
source = "Torex XC6206 series datasheet, pin assignment for SOT-23"

# v1.0.0's places were chosen with tscircuit's footprints, whose courtyards were the land patterns; JLCPCB's draw
# the bodies. Gate 2 of v1.0.0 checked the real bodies for clearance (paddle-keyer/design/bodies.json)
[[drc_allow]]
kind = "courtyards_overlap"
max = 8
why = "v1.0.0's places; bodies checked at its Gate 2 against bodies.json"

[[drc_allow]]
kind = "silk_edge_clearance"
max = 9
why = "the connectors' body outlines on silkscreen run to the board edge they overhang; JLCPCB clips silkscreen at the edge"

[[drc_allow]]
kind = "silk_over_copper"
max = 2
why = "neighbouring parts' outlines cross pads; JLCPCB clips silkscreen off exposed copper"

[nets.VBUS]
current_a = 0.5
[nets.V3V3]
current_a = 0.3
[nets.GND]
current_a = 0.5

[[zone]]
net = "GND"
layers = ["F.Cu", "B.Cu"]
clearance_mm = 0.25
min_width_mm = 0.25

[[paste]]
pad = "U1.57"
windows = [2, 2]
size_mm = 1.25
web_mm = 0.35

[[text]]
name = "version"
text = "paddle-keyer v{version}"
font = "fonts/Inter-ExtraBold.ttf"
cap_mm = 0.8
at = [0, -6]
frame = "centre"
rot_deg = 90
layer = "B.SilkS"
grow_mm = 0.02

[drawing]
title = "Paddle keyer: placement"
number = "PK-PLC-001"
author = "pcb"
thickness_mm = 1.6
finish = "HASL, green mask, white silkscreen"
notes = ["All parts on the top side are placed by JLCPCB; the test pads on the bottom are bare copper.", "Places are JLCPCB's footprint origins, the frame the CPL uses."]

