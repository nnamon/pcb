# Review 18's probes, kept as regression tests for its closed findings. Report: docs/reviews/18_m4.md
# Format: tests/cases/steps.toml. The probes on the M4 project share the paddle_keyer_m4 fixture's flow ({flow:...}); without it they run the flow themselves.

[[step]]
id = "review18"
name = "review 18: M4 probes"
run = ["tests/regressions/r18/check.py", "{pcb}", "{work}"]
covers = ["parts", "sync", "place", "footprint", "release"]
needs = ["freerouting"]
env = { PCB_R18_BASE = "{flow:paddle_keyer_m4}" }
