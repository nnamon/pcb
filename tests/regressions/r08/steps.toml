[[step]]
id = "review8_verify_edit_mutations"
name = "review 8: verify_edit mutations"
run = ["tests/regressions/r08/verify_edit_mutations.py", "{pcb}", "{work}"]
covers = ["edit"]

[[step]]
id = "review8_move_fp_vs_pcbnew"
name = "review 8: move_footprint against pcbnew"
run = ["tests/regressions/r08/move_fp_vs_pcbnew.py", "{pcb}", "{work}"]
