# Review 8's probes, kept as regression tests for its closed findings. Report: docs/reviews/08_m1.md
# Format: tests/cases/steps.toml.

[[step]]
id = "review8_edit_probes"
name = "review 8: edit probes"
run = ["tests/regressions/r08/edit_probes.py", "{pcb}", "{work}"]
covers = ["edit"]

[[step]]
id = "review8_diff_probes"
name = "review 8: diff probes"
run = ["tests/regressions/r08/diff_probes.py", "{pcb}", "{work}"]
covers = ["diff"]

[[step]]
id = "review8_project_probes"
name = "review 8: project probes"
run = ["tests/regressions/r08/project_probes.py", "{pcb}", "{work}"]
